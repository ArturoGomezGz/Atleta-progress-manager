services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: atleta
      POSTGRES_PASSWORD: atleta
      POSTGRES_DB: atleta
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U atleta -d atleta"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
