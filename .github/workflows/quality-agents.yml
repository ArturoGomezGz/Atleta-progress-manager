name: quality-agents

on:
  pull_request:
  workflow_dispatch:
    inputs:
      strict:
        description: "Fail the workflow when findings are detected"
        required: false
        default: false
        type: boolean
      action_mode:
        description: "report-only or open-issue"
        required: false
        default: "report-only"
        type: choice
        options:
          - report-only
          - open-issue
  schedule:
    - cron: "0 8 * * *"

permissions:
  contents: read

jobs:
  run-quality-agents:
    runs-on: ubuntu-latest
    outputs:
      findings_total: ${{ steps.summary.outputs.findings_total }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality agents
        id: run
        shell: bash
        run: |
          CMD=(node scripts/quality-agents/run-all.mjs --out-dir .quality-reports)
          STRICT_MODE="${{ github.event_name == 'workflow_dispatch' && inputs.strict || vars.QUALITY_AGENTS_STRICT || 'false' }}"
          if [[ "$STRICT_MODE" == "true" ]]; then
            CMD+=(--strict)
          fi
          "${CMD[@]}"
        continue-on-error: true

      - name: Read summary
        id: summary
        if: always()
        run: |
          if [ -f ".quality-reports/summary.json" ]; then
            FINDINGS_TOTAL=$(node -e "const fs=require('fs');const s=JSON.parse(fs.readFileSync('.quality-reports/summary.json','utf8'));process.stdout.write(String(s.totalFindings));")
          else
            FINDINGS_TOTAL="0"
          fi
          echo "findings_total=$FINDINGS_TOTAL" >> "$GITHUB_OUTPUT"
          echo "Total findings: $FINDINGS_TOTAL"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-agents-reports
          path: .quality-reports/

      - name: Enforce strict mode
        if: always()
        shell: bash
        run: |
          if [[ "${{ steps.run.outcome }}" != "success" ]]; then
            echo "Quality agents run failed."
            exit 1
          fi
          STRICT_MODE="${{ github.event_name == 'workflow_dispatch' && inputs.strict || vars.QUALITY_AGENTS_STRICT || 'false' }}"
          if [[ "$STRICT_MODE" == "true" && "${{ steps.summary.outputs.findings_total }}" != "0" ]]; then
            echo "Strict mode enabled and findings detected."
            exit 1
          fi

  open-issue:
    permissions:
      contents: read
      issues: write
    needs: run-quality-agents
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.action_mode == 'open-issue' && needs.run-quality-agents.outputs.findings_total != '0' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download reports
        uses: actions/download-artifact@v4
        with:
          name: quality-agents-reports
          path: .quality-reports

      - name: Open issue with report
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs")
            const body = fs.readFileSync(".quality-reports/summary.md", "utf8")
            const title = `Quality agents report - ${new Date().toISOString().slice(0, 10)}`
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body
            })
