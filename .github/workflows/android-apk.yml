name: android-apk

# APK de prueba de apps/mobile, apuntando a la API de testing. Se compila en cada push a
# `testing` (la rama que despliega la API de testing) que toque la app, o a mano desde Actions.
# Se publica como pre-release de GitHub para descargarlo directo en el teléfono.
# El APK de producción sale de android-apk-production.yml, desde `master`.
# Firmado con la llave de depuración: sirve para instalar a mano, no para la tienda.
# Es una app distinta a la de producción (APP_VARIANT=testing: com.atleta.app.testing, "Atleta Test"),
# así que se instalan las dos a la vez en el mismo teléfono.

on:
  push:
    branches: [testing]
    paths:
      - "apps/mobile/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

env:
  EXPO_PUBLIC_API_URL: https://api-testing-94f1.up.railway.app
  APP_VARIANT: testing

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Write google-services.json (Firebase push)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then printf '%s' "$GOOGLE_SERVICES_JSON" > apps/mobile/google-services.json
          else echo "::warning::Falta el secreto GOOGLE_SERVICES_JSON: el APK saldrá sin notificaciones push."; fi

      - name: Generate native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-preview-${{ github.run_number }}"
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "atleta-${TAG}.apk"
          gh release create "$TAG" "atleta-${TAG}.apk" \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "Atleta Android (prueba) #${{ github.run_number }}" \
            --notes "APK de prueba desde \`${GITHUB_REF_NAME}\` (${GITHUB_SHA::7}). Usa la API de testing: ${EXPO_PUBLIC_API_URL}"

      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          LABEL: "APK de testing"
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then echo "Sin secretos de Telegram: no se avisa."; exit 0; fi
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ "$JOB_STATUS" = "success" ]; then
            TEXT="✅ $LABEL listo (${GITHUB_SHA::7}): ${{ github.server_url }}/${{ github.repository }}/releases/tag/android-preview-${{ github.run_number }}"
          else
            TEXT="❌ $LABEL: la compilación terminó con estado $JOB_STATUS (${GITHUB_SHA::7}): $RUN_URL"
          fi
          curl -sS --max-time 20 "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" --data-urlencode "text=${TEXT}" >/dev/null || echo "::warning::No se pudo avisar por Telegram"
