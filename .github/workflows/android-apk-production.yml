name: android-apk-production

# APK de apps/mobile apuntando a la API de PRODUCCIÓN. Se publica como release
# (no pre-release) de GitHub. Se dispara al subir un tag `mobile-v*`
# (ej. `git tag mobile-v0.1.0 && git push origin mobile-v0.1.0`) o a mano desde Actions.
# Firmado con la llave de depuración: sirve para instalar a mano, no para la tienda.

on:
  push:
    tags: ["mobile-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag del release (ej. mobile-v0.1.0). Si ya existe, se usa; si no, se crea sobre el commit elegido."
        required: true

permissions:
  contents: write

concurrency:
  group: android-apk-production
  cancel-in-progress: false

env:
  EXPO_PUBLIC_API_URL: https://api-production-85b2.up.railway.app
  TAG: ${{ github.event.inputs.tag || github.ref_name }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate native Android project
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp apps/mobile/android/app/build/outputs/apk/release/app-release.apk "atleta-${TAG}.apk"
          gh release create "$TAG" "atleta-${TAG}.apk" \
            --target "${{ github.sha }}" \
            --title "Atleta Android ${TAG}" \
            --notes "APK desde \`${GITHUB_REF_NAME}\` (${GITHUB_SHA::7}). Usa la API de producción: ${EXPO_PUBLIC_API_URL}"
